name: truthwall-production

services:
  backend:
    build:
      context: ./Backend
      target: production
    init: true

    env_file:
      - ./Backend/.env.production

    environment:
      NODE_ENV: production
      PORT: "5000"
      CLIENT_URL: http://localhost:8080

    ports:
      - "127.0.0.1:5001:5000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      - backend

    restart: unless-stopped